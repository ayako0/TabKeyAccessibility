<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Keyboard Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }

        .interactive-container {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
        }

        /* Styling to visually show which element has focus */
        .interactive-element {
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .interactive-element:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
            background-color: #e6f2ff;
        }

        .virtual-keyboard {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
        }

        .nav-btn {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #tab-btn {
            background-color: #28a745;
        }

        #enter-btn {
            background-color: #dc3545;
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h3>Interactive Elements</h3>
    <div class="interactive-container">
        <!-- tabindex="0" allows non-form elements to receive keyboard focus -->
        <button class="interactive-element" onclick="logAction('Button 1 Clicked!')">Button 1</button>
        <button class="interactive-element" onclick="logAction('Button 2 Clicked!')">Button 2</button>
        <div class="interactive-element" tabindex="0" onclick="logAction('Div 3 Clicked!')">Div 3 (Focusable)</div>
        <button class="interactive-element" onclick="logAction('Button 4 Clicked!')">Button 4</button>
    </div>

    <div id="output">Click an element or use the controls below...</div>

    <h3>On-Screen Controls</h3>
    <div class="virtual-keyboard">
        <!-- These buttons use type="button" and preventDefault on mousedown 
             to prevent them from stealing focus from our target sequence -->
        <button id="tab-btn" class="nav-btn" type="button">TAB</button>
        <button id="enter-btn" class="nav-btn" type="button">ENTER</button>
    </div>

    <script>
        // Query all focusable elements within our target list
        const focusableElements = document.querySelectorAll('.interactive-container .interactive-element');
        const tabBtn = document.getElementById('tab-btn');
        const enterBtn = document.getElementById('enter-btn');
        const output = document.getElementById('output');

        // Helper to update text on screen when an element is triggered
        function logAction(message) {
            output.textContent = message;
        }

        // Prevent the control buttons from stealing focus when clicked
        // This keeps the blue focus outline on our target elements
        const preventFocusLoss = (e) => e.preventDefault();
        tabBtn.addEventListener('mousedown', preventFocusLoss);
        enterBtn.addEventListener('mousedown', preventFocusLoss);

        // Replicate Tab functionality
        tabBtn.addEventListener('click', () => {
            const currentActive = document.activeElement;
            // Find the index of the currently focused element in our array
            let currentIndex = Array.from(focusableElements).indexOf(currentActive);
            
            // Calculate next index (loops back to 0 if at the end)
            let nextIndex = (currentIndex + 1) % focusableElements.length;
            
            // Move focus to the next item
            focusableElements[nextIndex].focus();
        });

        // Replicate Enter functionality
        enterBtn.addEventListener('click', () => {
            const currentActive = document.activeElement;
            
            // Check if the currently focused element belongs to our interactive list
            if (Array.from(focusableElements).includes(currentActive)) {
                // Trigger the click logic of the active element
                currentActive.click();
            } else {
                output.textContent = "No valid element is currently focused.";
            }
        });
    </script>

</body>
</html>
